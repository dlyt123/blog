# ================================================================
# 个人博客网站 · Nginx 站点配置
#
# 用法：
#   sudo cp nginx-blog.conf /etc/nginx/sites-available/blog
#   sudo ln -sf /etc/nginx/sites-available/blog /etc/nginx/sites-enabled/blog
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# 说明：本文件是「只监听 80」的初始版本。
#       证书申请好之后，按《部署文档》第 7 章改成 443 + 强制跳转。
# ================================================================

server {
    listen 80;
    server_name example.cn www.example.cn;   # TODO 换成你的域名

    root /var/www/blog;
    index index.html;

    # 上传大小（后端自身限制图片 5MB，这里放宽一点避免误拦）
    client_max_body_size 10m;

    # gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # ① 前端静态资源（文件名带 hash，可长期缓存）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ② 用户上传的图片：Nginx 直接读磁盘，不经过后端
    #    ★ 这里的路径必须和后端启动参数 --blog.upload.dir 指向同一个目录
    location /uploads/ {
        alias /opt/blog/uploads/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ③ 后端接口
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # ★ 必须透传真实 IP：限流和访客留痕都依赖它，否则全是代理地址
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ④ 站点地图（后端生成，路径不带 /api 前缀）
    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:8080/sitemap.xml;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header Content-Type application/xml;
    }

    # ⑤ SPA 前端路由回退：刷新 /posts/3 这类地址时交给 index.html
    #    必须放最后，且不能影响上面几条
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 注意：不要在这里开 proxy_intercept_errors / error_page 兜底，
    # 否则会把后端的 401 / 429 吞掉，导致前端无法正确跳转登录页。
}
